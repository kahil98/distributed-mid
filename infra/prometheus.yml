global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: storage-nodes
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8201", "host.docker.internal:8202", "host.docker.internal:8203", "host.docker.internal:8204", "host.docker.internal:8205", "host.docker.internal:8206", "host.docker.internal:8207"]
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: metadata
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8100"]
