name: distributed-mid-storage-task
x-node: &node
  image: distributed-mid-storage-task:local
  build: .
  restart: unless-stopped
  environment: &node-env
    METADATA_URL: http://metadata:8000
    HEARTBEAT_INTERVAL: "3"
    MAX_CHUNK_BYTES: "8388608"
  depends_on:
    metadata:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
services:
  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
  gateway:
    image: distributed-mid-storage-task:local
    build: .
    command: ["uvicorn", "gateway_service.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      DATABASE_URL: postgresql://distributed:distributed@postgres:5432/distributed
      METADATA_URL: http://metadata:8000
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-local-exam-secret-change-before-deployment}
      GATEWAY_USERNAME: ${GATEWAY_USERNAME:-exam-user}
      GATEWAY_PASSWORD: ${GATEWAY_PASSWORD:-change-me}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-120}
    depends_on:
      elasticsearch:
        condition: service_healthy
      metadata:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      node.store.allow_mmap: "false"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s" > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
  job-worker:
    image: distributed-mid-storage-task:local
    build: .
    command: ["python", "scripts/job_worker.py"]
    environment:
      DATABASE_URL: postgresql://distributed:distributed@postgres:5432/distributed
      METADATA_URL: http://metadata:8000
      RABBITMQ_MANAGEMENT_URL: http://host.docker.internal:15672
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
    depends_on:
      metadata:
        condition: service_healthy
    restart: unless-stopped
  metadata:
    image: distributed-mid-storage-task:local
    build: .
    command: ["uvicorn", "metadata_service.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports: ["127.0.0.1:8100:8000"]
    environment:
      DATABASE_URL: postgresql://distributed:distributed@postgres:5432/distributed
      FIXED_CHUNK_SIZE: "4194304"
      RABBITMQ_MANAGEMENT_URL: http://host.docker.internal:15672
      RABBITMQ_USER: dev
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: distributed
      POSTGRES_PASSWORD: distributed
      POSTGRES_DB: distributed
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["metadata-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributed -d distributed"]
      interval: 5s
      timeout: 3s
      retries: 20
  node-1:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-1
      ADVERTISED_URL: http://node-1:8000
    ports: ["127.0.0.1:8201:8000"]
    volumes: ["node-1-data:/data"]
  node-2:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-2
      ADVERTISED_URL: http://node-2:8000
    ports: ["127.0.0.1:8202:8000"]
    volumes: ["node-2-data:/data"]
  node-3:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-3
      ADVERTISED_URL: http://node-3:8000
    ports: ["127.0.0.1:8203:8000"]
    volumes: ["node-3-data:/data"]
  node-4:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-4
      ADVERTISED_URL: http://node-4:8000
    ports: ["127.0.0.1:8204:8000"]
    volumes: ["node-4-data:/data"]
  node-5:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-5
      ADVERTISED_URL: http://node-5:8000
    ports: ["127.0.0.1:8205:8000"]
    volumes: ["node-5-data:/data"]
  node-6:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-6
      ADVERTISED_URL: http://node-6:8000
    ports: ["127.0.0.1:8206:8000"]
    volumes: ["node-6-data:/data"]
  node-7:
    <<: *node
    environment:
      <<: *node-env
      NODE_ID: node-7
      ADVERTISED_URL: http://node-7:8000
    ports: ["127.0.0.1:8207:8000"]
    volumes: ["node-7-data:/data"]
  node-8:
    <<: *node
    profiles: [scale-test]
    environment:
      <<: *node-env
      NODE_ID: node-8
      ADVERTISED_URL: http://node-8:8000
    ports: ["127.0.0.1:8208:8000"]
    volumes: ["node-8-data:/data"]
volumes:
  node-1-data:
  node-2-data:
  node-3-data:
  node-4-data:
  node-5-data:
  node-6-data:
  node-7-data:
  node-8-data:
  metadata-postgres:
  elasticsearch-data:
